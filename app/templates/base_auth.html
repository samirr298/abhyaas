<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Abhyas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="auth-root">
    <div class="auth-outer">
      <div class="auth-inner">
        <aside class="auth-left">
          {% block left_brand %}
          <div class="brand">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Abhyas" class="brand-logo" onerror="this.style.display='none'">
            <h1>Abhyas</h1>
            <p class="brand-sub">Empowering your learning journey.</p>
          </div>
          {% endblock %}
        </aside>

        <section class="auth-right">
            
          <div class="auth-card-wrap">
            
            {% block right_content %}{% endblock %}
          </div>
        </section>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  </body>
</html>
