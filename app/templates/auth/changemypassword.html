{% extends 'base_app.html' %}

{% block title %}Change Password{% endblock %}
{% block page_heading %}Change Password{% endblock %}

{% block content %}
<div class="settings-card password-card">
  <h2>Change Password</h2>

  <form id="passwordForm" action="{{ url_for('auth.change_my_password') }}" method="POST" class="auth-form">
    <div class="field">
      <span for="currentPassword">Current Password</span>
      <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">
    </div>

    <div class="field">
      <span for="newPassword">New Password</span>
      <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password">
      <span class="hint">Must be at least 8 characters.</span>
    </div>

    <div class="field">
      <span for="confirmPassword">Confirm New Password</span>
      <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
      <div id="errorText" class="error-message">Passwords do not match.</div>
    </div>

    <button type="submit" class="btn-primary">Update Password</button>
  </form>
</div>
{% endblock %}
