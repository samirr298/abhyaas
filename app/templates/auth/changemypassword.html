<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="password-page">

  <div class="card">
    <h2>Change Password</h2>
    
    <form id="passwordForm" action="/update-password" method="POST">
      
      <!-- Current Password -->
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input 
          type="password" 
          id="currentPassword" 
          name="currentPassword" 
          required 
          autocomplete="current-password"
        >
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          required 
          minlength="8"
          autocomplete="new-password"
        >
        <span class="hint">Must be at least 8 characters.</span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          required 
          autocomplete="new-password"
        >
        <div id="errorText" class="error-message">Passwords do not match.</div>
      </div>

      <button type="submit">Update Password</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('passwordForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const errorText = document.getElementById('errorText');

    function validatePasswords() {
      if (newPassword.value !== confirmPassword.value) {
        // Show error UI
        errorText.style.display = 'block';
        confirmPassword.style.borderColor = 'var(--error-color)';
        return false;
      } else {
        // Reset UI if they match
        errorText.style.display = 'none';
        confirmPassword.style.borderColor = 'var(--border-color)';
        return true;
      }
    }

    // Check while the user types
    confirmPassword.addEventListener('input', validatePasswords);
    newPassword.addEventListener('input', validatePasswords);

    // Final check before sending data to the server
    form.addEventListener('submit', function(event) {
      if (!validatePasswords()) {
        event.preventDefault(); // Stop the form from submitting
      }
    });
  </script>

</body>
</html>
