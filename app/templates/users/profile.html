{% extends "base_app.html" %}

{% block title %}Profile{% endblock %}
{% block page_heading %}Profile{% endblock %}

{% block content %}
<div class="cards profile-grid">
  <div class="card profile-card">
    <div class="profile-header">
      <div class="profile-copy">
        <h2>{{ username or 'User' }}</h2>
        <p class="muted">{{ email }}</p>
        <p class="muted">Role: {{ role }}</p>
      </div>

      <div class="profile-picture">
        {% if profile_url %}
        <img src="{{ profile_url }}" alt="Profile picture" />
        {% else %}
        <img id="profilePreview" src="/static/images/profile_pics/{{ filename }}" alt="Profile picture" />
        {% endif %}
      </div>
    </div>

    <form action="{{ url_for('auth.profile') }}" method="POST" enctype="multipart/form-data" class="profile-upload-form">
      <div class="profile-upload-row">
        <label class="file-label" for="profilePicInput">
          Choose file
        </label>
        <input type="file" name="profile_image" id="profilePicInput" accept="image/*" class="profile-file-input">
        <button class="btn-primary upload-btn" type="submit">Upload file</button>
      </div>
    </form>
  </div>

  <div class="card profile-card">
    <h3>Account Actions</h3>
    <div class="profile-actions" style="color: black;">
      <a class="btn-secondary full-width" href="{{ url_for('auth.change_my_password') }}">Change Password</a>
      <a class="btn-secondary full-width" href="{{ url_for('auth.logout') }}">Logout</a>

    </div>
  </div>
</div>
{% endblock %}
