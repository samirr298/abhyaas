<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Abhyas - Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body class="app-root">
    <div class="app-shell">
      <aside class="app-sidebar">
        <div class="sidebar-brand">
          <img src="/static/img/logo.png" alt="logo" onerror="this.style.display='none'">
          <span>Abhyas</span>
        </div>
        <nav class="sidebar-nav">
          <a class="active" href="#">Dashboard</a>
          <a href="#">Tasks</a>
          <a href="#">Attendance</a>
          <a href="#">Announcements</a>
          <a href="#">Profile</a>
        </nav>
        <div class="sidebar-change">
          <a class="sidebar-link" href="#settings">Change My Password</a>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <input class="search" placeholder="Search tasks, materials, or people...">
          </div>
          <div class="topbar-right">
            <div class="notif">🔔</div>
            <div class="avatar">S</div>
          </div>
        </header>

        <main class="app-content">
          <div class="container-lg">
            <div class="dashboard-header">
              <h1>{% block page_heading %}Dashboard{% endblock %}</h1>
            </div>

            <section class="card settings-card" id="settings">
              <h2>Change Password</h2>
              <form action="#" method="POST" class="auth-form" onsubmit="return false;">
                <label class="field">
                  <span>Old Password</span>
                  <input type="password" name="old_password" placeholder="Enter old password">
                </label>
                <label class="field">
                  <span>New Password</span>
                  <input type="password" name="new_password" placeholder="Enter new password">
                </label>
                <label class="field">
                  <span>Confirm New Password</span>
                  <input type="password" name="confirm_password" placeholder="Confirm new password">
                </label>
                <button class="btn-primary" type="submit">Save Password</button>
              </form>
            </section>

            {% block content %}
            <p>Welcome to your dashboard.</p>
            {% endblock %}
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
